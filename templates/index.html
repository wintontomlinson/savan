<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Savan — Music Player</title>
    <link rel="stylesheet" href="/static/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-logo">
                <svg viewBox="0 0 24 24" width="32" height="32" fill="currentColor">
                    <circle cx="12" cy="12" r="11" stroke="currentColor" stroke-width="1" fill="none"/>
                    <polygon points="10,8 16,12 10,16" fill="currentColor"/>
                </svg>
                <span>Savan</span>
            </div>
            <nav class="sidebar-nav">
                <a href="#" class="nav-item active" data-page="home">
                    <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M12.5 3.247a1 1 0 0 0-1 0L4 7.577V20h4.5v-6a1 1 0 0 1 1-1h5a1 1 0 0 1 1 1v6H20V7.577l-7.5-4.33zm-2-1.732a3 3 0 0 1 3 0l7.5 4.33a2 2 0 0 1 1 1.732V21a1 1 0 0 1-1 1h-6.5a1 1 0 0 1-1-1v-6h-3v6a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V7.577a2 2 0 0 1 1-1.732l7.5-4.33z"/></svg>
                    <span>Home</span>
                </a>
                <a href="#" class="nav-item" data-page="search">
                    <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M10.533 1.279c-5.18 0-9.407 4.14-9.407 9.279s4.226 9.279 9.407 9.279c2.234 0 4.29-.77 5.907-2.058l4.353 4.353a1 1 0 1 0 1.414-1.414l-4.344-4.344a9.157 9.157 0 0 0 2.077-5.816c0-5.14-4.226-9.28-9.407-9.28zm-7.407 9.28c0-4.006 3.302-7.28 7.407-7.28s7.407 3.274 7.407 7.28-3.302 7.279-7.407 7.279-7.407-3.273-7.407-7.28z"/></svg>
                    <span>Search</span>
                </a>
            </nav>
            <div class="sidebar-library">
                <div class="library-header">
                    <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M3 22a1 1 0 0 1-1-1V3a1 1 0 0 1 2 0v18a1 1 0 0 1-1 1zM15.5 2.134A1 1 0 0 0 14 3v18a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1V6.464a1 1 0 0 0-.5-.866l-6-3.464zM9 2a1 1 0 0 0-1 1v18a1 1 0 1 0 2 0V3a1 1 0 0 0-1-1z"/></svg>
                    <span>Your Library</span>
                </div>
                <div class="library-content">
                    <div class="library-empty">
                        <p>Your queue will appear here</p>
                    </div>
                    <ul class="queue-list" id="queueList"></ul>
                </div>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Home Page -->
            <section class="page active" id="homePage">
                <div class="page-header">
                    <h1 class="greeting" id="greeting">Good Evening</h1>
                </div>
                <div class="section">
                    <h2>Trending Now</h2>
                    <p class="section-subtitle">Search for your favourite songs to start listening</p>
                    <div class="trending-grid" id="trendingGrid">
                        <!-- Filled by JS -->
                    </div>
                </div>
            </section>

            <!-- Search Page -->
            <section class="page" id="searchPage">
                <div class="search-header">
                    <div class="search-input-wrapper">
                        <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M10.533 1.279c-5.18 0-9.407 4.14-9.407 9.279s4.226 9.279 9.407 9.279c2.234 0 4.29-.77 5.907-2.058l4.353 4.353a1 1 0 1 0 1.414-1.414l-4.344-4.344a9.157 9.157 0 0 0 2.077-5.816c0-5.14-4.226-9.28-9.407-9.28zm-7.407 9.28c0-4.006 3.302-7.28 7.407-7.28s7.407 3.274 7.407 7.28-3.302 7.279-7.407 7.279-7.407-3.273-7.407-7.28z"/></svg>
                        <input type="text" id="searchInput" placeholder="What do you want to listen to?" autocomplete="off">
                        <button class="search-clear" id="searchClear">&times;</button>
                    </div>
                </div>
                <div class="search-results" id="searchResults">
                    <div class="search-placeholder">
                        <svg viewBox="0 0 24 24" width="64" height="64" fill="currentColor" opacity="0.3"><path d="M10.533 1.279c-5.18 0-9.407 4.14-9.407 9.279s4.226 9.279 9.407 9.279c2.234 0 4.29-.77 5.907-2.058l4.353 4.353a1 1 0 1 0 1.414-1.414l-4.344-4.344a9.157 9.157 0 0 0 2.077-5.816c0-5.14-4.226-9.28-9.407-9.28zm-7.407 9.28c0-4.006 3.302-7.28 7.407-7.28s7.407 3.274 7.407 7.28-3.302 7.279-7.407 7.279-7.407-3.273-7.407-7.28z"/></svg>
                        <h2>Search for songs</h2>
                        <p>Find your favourite songs, albums, and artists</p>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <!-- Bottom Player Bar -->
    <div class="player-bar" id="playerBar">
        <div class="player-left">
            <div class="player-album-art" id="playerAlbumArt">
                <img src="" alt="" id="playerImg">
            </div>
            <div class="player-song-info">
                <span class="player-song-name" id="playerSongName">No song playing</span>
                <span class="player-artist-name" id="playerArtistName"></span>
            </div>
        </div>
        <div class="player-center">
            <div class="player-controls">
                <button class="control-btn" id="btnShuffle" title="Shuffle">
                    <svg viewBox="0 0 16 16" width="16" height="16" fill="currentColor"><path d="M13.151.922a.75.75 0 1 0-1.06 1.06L13.109 3H11.16a3.75 3.75 0 0 0-2.873 1.34l-6.173 7.356A2.25 2.25 0 0 1 .39 12.5H0V14h.391a3.75 3.75 0 0 0 2.873-1.34l6.173-7.356a2.25 2.25 0 0 1 1.724-.804h1.947l-1.017 1.018a.75.75 0 0 0 1.06 1.06l2.306-2.306a.75.75 0 0 0 0-1.06L13.15.922zM.391 3.5H0V2h.391c1.109 0 2.16.49 2.873 1.34L4.89 5.277l-.979 1.167-1.796-2.14A2.25 2.25 0 0 0 .39 3.5z"/><path d="m7.5 10.723.98-1.167 1.796 2.14a2.25 2.25 0 0 0 1.724.804h1.947l-1.017-1.018a.75.75 0 1 1 1.06-1.06l2.306 2.306a.75.75 0 0 1 0 1.06L13.15 15.06a.75.75 0 1 1-1.06-1.06l1.018-1.018H11.16a3.75 3.75 0 0 1-2.873-1.34L7.5 10.723z"/></svg>
                </button>
                <button class="control-btn" id="btnPrev" title="Previous">
                    <svg viewBox="0 0 16 16" width="16" height="16" fill="currentColor"><path d="M3.3 1a.7.7 0 0 1 .7.7v5.15l9.95-5.744a.7.7 0 0 1 1.05.606v12.575a.7.7 0 0 1-1.05.607L4 9.149V14.3a.7.7 0 0 1-.7.7H2a.7.7 0 0 1-.7-.7V1.7a.7.7 0 0 1 .7-.7h1.3z"/></svg>
                </button>
                <button class="control-btn play-btn" id="btnPlay" title="Play">
                    <svg viewBox="0 0 16 16" width="20" height="20" fill="currentColor" id="playIcon"><path d="M3 1.713a.7.7 0 0 1 1.05-.607l10.89 6.288a.7.7 0 0 1 0 1.212L4.05 14.894A.7.7 0 0 1 3 14.288V1.713z"/></svg>
                    <svg viewBox="0 0 16 16" width="20" height="20" fill="currentColor" id="pauseIcon" style="display:none"><path d="M2.7 1a.7.7 0 0 0-.7.7v12.6a.7.7 0 0 0 .7.7h2.6a.7.7 0 0 0 .7-.7V1.7a.7.7 0 0 0-.7-.7H2.7zm8 0a.7.7 0 0 0-.7.7v12.6a.7.7 0 0 0 .7.7h2.6a.7.7 0 0 0 .7-.7V1.7a.7.7 0 0 0-.7-.7h-2.6z"/></svg>
                </button>
                <button class="control-btn" id="btnNext" title="Next">
                    <svg viewBox="0 0 16 16" width="16" height="16" fill="currentColor"><path d="M12.7 1a.7.7 0 0 0-.7.7v5.15L2.05 1.107A.7.7 0 0 0 1 1.712v12.575a.7.7 0 0 0 1.05.607L12 9.149V14.3a.7.7 0 0 0 .7.7H14a.7.7 0 0 0 .7-.7V1.7a.7.7 0 0 0-.7-.7h-1.3z"/></svg>
                </button>
                <button class="control-btn" id="btnRepeat" title="Repeat">
                    <svg viewBox="0 0 16 16" width="16" height="16" fill="currentColor"><path d="M0 4.75A3.75 3.75 0 0 1 3.75 1h8.5A3.75 3.75 0 0 1 16 4.75v5a3.75 3.75 0 0 1-3.75 3.75H9.81l1.018 1.018a.75.75 0 1 1-1.06 1.06L7.46 13.27a.75.75 0 0 1 0-1.06l2.308-2.308a.75.75 0 0 1 1.06 1.06L9.811 12h2.439a2.25 2.25 0 0 0 2.25-2.25v-5a2.25 2.25 0 0 0-2.25-2.25h-8.5A2.25 2.25 0 0 0 1.5 4.75v5A2.25 2.25 0 0 0 3.75 12H5v1.5H3.75A3.75 3.75 0 0 1 0 9.75v-5z"/></svg>
                </button>
            </div>
            <div class="progress-container">
                <span class="progress-time" id="currentTime">0:00</span>
                <div class="progress-bar" id="progressBar">
                    <div class="progress-filled" id="progressFilled"></div>
                    <div class="progress-thumb" id="progressThumb"></div>
                </div>
                <span class="progress-time" id="totalTime">0:00</span>
            </div>
        </div>
        <div class="player-right">
            <button class="control-btn" id="btnVolume" title="Volume">
                <svg viewBox="0 0 16 16" width="16" height="16" fill="currentColor" id="volumeIcon"><path d="M9.741.85a.75.75 0 0 1 .375.65v13a.75.75 0 0 1-1.125.65l-6.925-4a3.642 3.642 0 0 1-1.33-4.967 3.639 3.639 0 0 1 1.33-1.332l6.925-4a.75.75 0 0 1 .75 0zm-6.924 5.3a2.139 2.139 0 0 0 0 3.7l5.8 3.35V2.8l-5.8 3.35zm8.683 4.29V5.56a2.75 2.75 0 0 1 0 4.88z"/><path d="M11.5 13.614a5.752 5.752 0 0 0 0-11.228v1.55a4.252 4.252 0 0 1 0 8.127v1.55z"/></svg>
            </button>
            <div class="volume-bar" id="volumeBar">
                <div class="volume-filled" id="volumeFilled"></div>
                <div class="volume-thumb" id="volumeThumb"></div>
            </div>
        </div>
    </div>

    <!-- Audio Element -->
    <audio id="audioPlayer" preload="auto"></audio>

    <!-- Loading Overlay -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="spinner"></div>
    </div>

    <script src="/static/app.js"></script>
</body>
</html>
